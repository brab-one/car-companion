# OpenOCD script: start the sketch on the microcontroller without flashing it.
# App Lab builds sketches to wait for its go-ahead, which it gives at the end of
# flashing (flash_sketch.cfg in the board package): a reset, then a magic word
# in the backup RAM that the loader waits for. This is only that last part.
reset_config srst_only srst_nogate srst_push_pull connect_assert_srst
init
reset
sleep 100
mww 0x40036400 0xCAFFEEEE
shutdown
